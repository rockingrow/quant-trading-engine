# Standalone NATS for local development.
#
# In production QTE usually connects to the *broker's* NATS instead of running
# its own — signals go onto that cluster's JetStream `SIGNALS` stream, and a
# second cluster would mean the broker never sees them. Keep this one for
# laptop work, or run it and point QTE_BROKER__NATS_URL at the broker.

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
}

# Uncomment and set QTE_NATS__TOKEN to match before exposing this port anywhere.
# authorization {
#   token: "change-me"
# }
