# QTE's NATS server.
#
# The compose containers use the `nats` service name; the MT5 ingester on
# another machine dials this host's published port (TAILSCALE_ENABLED=false) or
# nats://<TAILSCALE_HOSTNAME>:4222 over the tailnet (true) — see the `tailscale`
# service in docker-compose.yml. Either way it is reachable from beyond this
# host, which is exactly why the token below is mandatory instead of commented
# out.
#
# In production QTE usually connects to the *broker's* NATS instead of running
# its own: signals go onto that cluster's JetStream `SIGNALS` stream, and a
# second cluster would mean the broker never sees them. Keep this one for QTE's
# own candle traffic, or run it and point ALGO_BROKER__NATS_URL at the broker.

port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 4GB
}

# The same value the clients send as QTE_NATS__TOKEN. Taken from the
# environment so the server and the engine cannot drift apart, and so the token
# never sits in a committed file. NATS refuses to start if it is unset.
authorization {
  token: $QTE_NATS__TOKEN
}
