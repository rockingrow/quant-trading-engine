# What the Binance provider would feed. A PLACEHOLDER: the provider is not
# implemented yet, and listing it in QTE_MARKET_DATA__PROVIDER stops ingestion
# at start-up with a "not implemented" error.
#
#   make binance        # writes config/binance.toml from this template
#
# With several providers (QTE_MARKET_DATA__PROVIDER=mt5,binance) each reads its
# own `config/<provider>.toml`: this file lists the symbols Binance feeds, and
# `config/mt5.toml` the ones the MT5 ingester feeds. A symbol may appear in only
# one of them.
#
# This template is tracked; `config/binance.toml` is git-ignored, for the same
# reason as `config/tiingo.example.toml`. The API key stays in `.env`.

[provider]
backfill_history = true

# [symbols.BTCUSDT]
# market = "crypto"
# timeframes = ["M15"]
