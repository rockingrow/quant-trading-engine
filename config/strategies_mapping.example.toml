# Which strategies trade which symbols.
#
#   cp config/strategies_mapping.example.toml config/strategies_mapping.toml
#
# This template is tracked; `config/strategies_mapping.toml` is git-ignored,
# because what you actually trade — and at what risk — is position
# information and this repo is public. Keep the two in step: a key added here
# is a key the operator can use, and a key only in the real file is one
# nobody can review.
#
# The runner reads `config/strategies_mapping.toml` on boot. Override the path with
# QTE_ENGINE__MAPPING_FILE to mount it as a secret instead. With no file at
# all, nothing breaks: each strategy falls back to its own `symbols` attribute,
# or to QTE_ENGINE__SYMBOLS when it declares none.
#
# Validate a table before deploying it:
#
#   make audit          # checks mapping against what __strategies__/ publishes
#
# Names on the right-hand side are *strategy names* — the `name` attribute, or
# the manifest alias — not class names. `make strategies` lists what is loaded.


# Applied to any symbol whose entry lists no strategies of its own. Leave it
# empty to require every symbol to say what it wants.
[defaults]
strategies = []


# ── Per-strategy default parameters ────────────────────────────────────
# One table per strategy, keyed by strategy name. Every value here applies to
# that strategy on every symbol it runs on. A pair that needs a different
# number restates just that key under [symbols.<symbol>.params.<strategy>]
# below, which wins. Omit the table and the strategy keeps whatever defaults
# its own code sets.

[strategies.EXAMPLE_GOLD_M15_V1]
risk_percent = 3.0
tp1_qty_percent = 50
use_equity_sizing = false
# Read by the engine, not the strategy: whether the weekend window the strategy's
# repository declares (settings.py) is enforced. Omit it to keep the repository's
# declared default; true on a strategy that declares no window stops the pair
# from starting. Applies to the backtest too.
use_weekend_flat = true
# Read by the engine, not the strategy: how many trade cycles this strategy may
# hold on one symbol at once. Off, the pair holds one position and a second
# entry is refused. On, it may hold up to max_open_cycles positions side by
# side, each under its own signal_uxid with its own bracket, and every close
# names the cycle it closes. The broker worker must run a hedging account, or
# the positions merge. Applies to the backtest too, and a pair may restate
# either key under [symbols.<symbol>.params.<strategy>].
allow_multiple_cycles = false
max_open_cycles = 1


# ── One table per symbol ────────────────────────────────────────────────

[symbols.XAUUSD]
strategies = ["EXAMPLE_GOLD_M15_V1", "EXAMPLE_GOLD_M5_SCALP"]

# Per-pair parameter overrides, keyed by strategy name. They win over the
# [strategies.EXAMPLE_GOLD_M15_V1] defaults above — so one strategy can run
# tighter on gold than it does on everything else.
[symbols.XAUUSD.params.EXAMPLE_GOLD_M15_V1]
risk_percent = 1.0
atr_sl_mult = 1.5
# A list is passed through to the strategy as a list. Which keys a strategy
# reads is its own business — this one names UTC windows it takes no entries in.
skip_windows = ["05:00-09:00", "19:00-20:00"]

[symbols.XAUUSD.params.EXAMPLE_GOLD_M5_SCALP]
risk_percent = 0.5


[symbols.BTCUSDT]
strategies = ["EXAMPLE_CRYPTO_M15_V1"]

[symbols.BTCUSDT.params.EXAMPLE_CRYPTO_M15_V1]
risk_percent = 0.75


# `enabled = false` parks a symbol without deleting its configuration, so
# turning it back on is a one-word edit and the diff says what happened.
[symbols.EURUSD]
enabled = false
strategies = ["EXAMPLE_FX_M15_V1"]


# Testing the broker hand-off, not trading: SIGNAL_SIMULATOR_LIFECYCLE_V1 from
# __strategies__/qte-signal-simulator opens on every closed bar and walks each
# cycle to TP1 → TP2, SL, or TP1 → R_SL at random. It names no symbol and no
# timeframe of its own — list it under the symbol you want, and give it the bar
# in `timeframe`, which must be one ingestion produces for that symbol.
# Demo accounts only.
#
# [symbols.XAUUSD]
# strategies = ["SIGNAL_SIMULATOR_LIFECYCLE_V1"]
#
# [symbols.XAUUSD.params.SIGNAL_SIMULATOR_LIFECYCLE_V1]
# timeframe = "M1"
# use_weekend_flat = false
# # One cycle per pair re-enters on the bar after each exit; three or more
# # lets it enter on every bar while earlier cycles are still being walked.
# allow_multiple_cycles = true
# max_open_cycles = 3
# # TP1 must leave something for TP2 / R_SL to close.
# tp1_qty_percent = 50
# # outcome = "sl"          # force one path: tp1_tp2 | sl | tp1_rsl
# # weights = [1, 1, 1]     # draw weights, in that order
# # seed = 0                # a different seed, a different sequence
