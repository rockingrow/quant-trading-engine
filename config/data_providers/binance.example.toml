# What the Binance provider would feed. A PLACEHOLDER: the provider is not
# implemented yet, and listing it in QTE_MARKET_DATA__PROVIDER stops ingestion
# at start-up with a "not implemented" error.
#
#   make binance        # writes config/data_providers/binance.toml from this template
#
# With several providers (QTE_MARKET_DATA__PROVIDER=mt5,binance) each reads its
# own `config/data_providers/<provider>.toml`: this file lists the symbols Binance feeds, and
# `config/data_providers/mt5.toml` the ones the MT5 ingester feeds. A symbol may appear in only
# one of them.
#
# This template is tracked; `config/data_providers/binance.toml` is git-ignored, for the same
# reason as `config/data_providers/tiingo.example.toml`. The API key stays in `.env`.

[provider]
backfill_history = true
# Which of the ingester's `schema_version` values this gateway would decode —
# the same knob as `config/data_providers/mt5.example.toml`, because the Binance
# gateway publishes the same `bar.closed` envelope. Read only once the provider
# is implemented; see that file for what an entry means.
schema_versions = ["1.0.0"]

# [symbols.BTCUSDT]
# market = "crypto"
# timeframes = ["M15"]
