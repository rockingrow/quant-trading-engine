[project]
name = "qte-api"
version = "0.1.0"
description = "QTE control-plane API: health, strategies, signal audit history, backtest trigger, shadow-mode switch."
requires-python = ">=3.11"
dependencies = [
    "qte-shared",
    "qte-backtest",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
qte-api = "qte_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qte_api"]
