[project]
name = "qte-strategy-engine"
version = "0.1.0"
description = "QTE strategy runner: dynamic plugin loading, NATS event loop, broker signal emission, audit."
requires-python = ">=3.11"
dependencies = [
    "qte-shared",
    "httpx>=0.27",
]

[project.scripts]
qte-strategy-runner = "qte_strategy_engine.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qte_strategy_engine"]
