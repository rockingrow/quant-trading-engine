# QTE local/VPS stack.
#
# The schema is NOT created by this file. Run `make db-upgrade` after the first
# `up` — Alembic owns the schema, and an init-hook script would only ever run on
# an empty volume, which is precisely the case a migration tool exists to
# outgrow.
#
# `nats` here is for standalone development. In production you normally point
# QTE_BROKER__NATS_URL at the *broker's* NATS, because that is where the
# JetStream `SIGNALS` stream its workers consume actually lives — publishing to
# a second cluster would mean nobody ever receives the signals. Run this one
# either way for QTE's own candle traffic, or set QTE_NATS__URL to the broker's
# cluster and drop this service.

name: qte

# Container-side network URLs. .env carries the host-side ones (127.0.0.1) so
# `make ingestion` / alembic / qte-simulator on the host work out of the box;
# these overrides swap them for the compose service names once the process is
# inside the network. `environment:` wins over `env_file:` in compose, so the
# same .env drives both worlds.
x-container-urls: &container-urls
  QTE_NATS__URL: nats://nats:4222
  QTE_REDIS__URL: redis://redis-cache:6379/0
  QTE_POSTGRES__DSN: postgresql+asyncpg://qte:qte@postgres-audit:5432/qte_audit
  QTE_SIMULATOR__URL: ws://market-simulator:8901/stream

x-app: &app
  env_file: [.env]
  environment: *container-urls
  restart: unless-stopped
  volumes:
    # The private strategy repo, mounted read-only: the engine loads it and
    # can never write to it.
    - ./__strategies__:/app/__strategies__:ro
    # Which strategies trade which symbols. Read-only and mounted rather than
    # baked in: it is git-ignored, so it is never in the image, and changing
    # the book is a restart rather than a rebuild.
    - ./config:/app/config:ro
    - ./data/parquet:/app/data/parquet
    - ./data/reports:/app/data/reports
  depends_on:
    redis-cache: {condition: service_healthy}
    postgres-audit: {condition: service_healthy}
    nats: {condition: service_started}
    # Every app service waits for the migration one-shot to finish cleanly —
    # so `docker compose up` alone brings the schema to head, no side call.
    db-migrate: {condition: service_completed_successfully}

services:
  redis-cache:
    image: redis:7-alpine
    # AOF on: hot state (open cycles, the warm-up window) has to survive a
    # restart, and losing the cycle id of an open position means the engine
    # forgets which trade it is in.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports: ["${QTE_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-audit:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qte}
      POSTGRES_DB: ${POSTGRES_DB:-qte_audit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["${QTE_POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qte} -d ${POSTGRES_DB:-qte_audit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "${QTE_NATS_PORT:-4222}:4222"
      - "${QTE_NATS_MONITOR_PORT:-8222}:8222"

  # One-shot: `alembic upgrade head` against postgres-audit, then exit 0.
  # App services `depends_on` this with condition: service_completed_successfully,
  # so a plain `docker compose up` migrates before anything reads the schema.
  # Reuses the strategy-runner image because it already ships alembic.ini and
  # the migrations/ tree; building a bespoke image just to run one command
  # would burn a second slot for no gain.
  db-migrate:
    env_file: [.env]
    environment: *container-urls
    build:
      context: .
      dockerfile: Dockerfile
      # env.py imports models from every engine that owns tables; the runner
      # image ships only its own, so ask the builder for the sibling packages
      # too. Backtest brings pyarrow, which is why the runner image itself
      # deliberately does not — but a one-shot migrator can afford it.
      args:
        QTE_PACKAGE: qte-strategy-engine
        QTE_EXTRA_PACKAGES: qte-backtest qte-ingestion
    depends_on:
      postgres-audit: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  data-ingestion:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      # No pyarrow, no backtest engine — this container only reads the feed.
      args: {QTE_PACKAGE: qte-ingestion}
    command: ["qte-ingestion"]

  strategy-runner:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      # Ships qte-strategy-runner and qte-control. NOT the backtest engine:
      # strategy-engine does not depend on it, so replaying history is done on
      # the host with `make backtest`, not inside the live trading container.
      args: {QTE_PACKAGE: qte-strategy-engine}
    command: ["qte-strategy-runner"]

  # The dev-only market data simulator.
  #
  # Started by every `docker compose up` — the in-process guard
  # (`qte_shared.dev_only`) refuses to run outside dev, so leaving it out of
  # a profile is safe. Two feeds on one symbol still race the resampler; when
  # you want a real vendor instead, set QTE_MARKET_DATA__PROVIDER=tiingo (or
  # equivalent) and stop this service explicitly.
  #
  # It depends on nothing: no Redis, no Postgres, no NATS. It owns a socket and
  # the ticks it is told to send, and everything downstream of that is the real
  # pipeline — which is what makes the rehearsal worth running.
  market-simulator:
    env_file: [.env]
    environment: *container-urls
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args: {QTE_PACKAGE: qte-simulator}
    command: ["qte-simulator", "serve"]
    # Published so the CLI on the host can drive it:
    #   qte-simulator replay --symbol XAUUSD --generate 300
    #
    # Both sides are variables, unlike the other services: those images always
    # listen on their standard port, while this one binds whatever
    # QTE_SIMULATOR__PORT says. Hard-coding the container side would leave the
    # mapping pointing at a port nothing is listening on the moment someone
    # changed it. QTE_SIMULATOR__URL has to follow it too.
    ports: ["${QTE_SIMULATOR_PORT:-8901}:${QTE_SIMULATOR__PORT:-8901}"]

  # One-shot: validate what __strategies__/ publishes before trusting it.
  #
  #     docker compose run --rm strategy-audit
  #
  # No service depends_on this one, deliberately. `depends_on` would gate on a
  # container that has already exited successfully, so it answers the question
  # once — when the stack first came up — and never again however often the
  # runner restarts or the read-only mount changes underneath it. The runner
  # audits its own book on every start instead: QTE_RUNNER__AUDIT_ON_START.
  # And data-ingestion never imports a strategy, so a strategy defect is not
  # its business; stopping the feed over one would only cost the candles
  # needed to debug it.
  #
  # Behind a profile so `docker compose up` does not start it — it exits, and a
  # container that exits non-zero on purpose has no business in `up`. Same
  # image as the runner would be, minus the reason to restart.
  strategy-audit:
    profiles: ["tools"]
    env_file: [.env]
    build:
      context: .
      dockerfile: Dockerfile
      args: {QTE_PACKAGE: qte-strategy-audit}
    volumes:
      - ./__strategies__:/app/__strategies__:ro
      - ./config:/app/config:ro
    command: ["qte-strategy-audit", "--strict"]

volumes:
  redis-data:
  postgres-data:
  nats-data:
