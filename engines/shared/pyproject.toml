[project]
name = "qte-shared"
version = "0.1.0"
description = "QTE shared core: models, indicators, strategy base, provider interfaces, NATS/Redis/Postgres adapters."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "nats-py>=2.7",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "orjson>=3.10",
]

# Market data vendors ship with shared but their client libraries do not: an
# image installs the extra for the provider it is configured to use, so the
# strategy runner carries neither an HTTP nor a WebSocket stack it never opens.
[project.optional-dependencies]
tiingo = [
    "httpx>=0.27",
    "websockets>=12.0",
]
# The dev-only simulator's feed is a WebSocket client like any vendor's, so it
# is an extra like any vendor's — an image that never talks to the simulator
# does not install a socket stack for it.
simulator = [
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_shared"]
