[project]
name = "qte-ingestion"
version = "0.1.0"
description = "QTE data ingestion: Tiingo WebSocket -> resampler -> Redis state + NATS events."
requires-python = ">=3.11"
dependencies = [
    "qte-shared",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.scripts]
qte-ingestion = "qte_ingestion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_ingestion"]
