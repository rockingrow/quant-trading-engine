[project]
name = "qte-ingestion"
version = "0.1.0"
description = "QTE data ingestion: provider live feed -> resampler -> Redis state + NATS events."
requires-python = ">=3.13,<3.14"
dependencies = [
    # The extra names the market data vendor this image ships with; swapping
    # providers is one word here plus QTE_MARKET_DATA__PROVIDER.
    "qte-shared[tiingo]",
]

[project.scripts]
qte-ingestion = "qte_ingestion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_ingestion"]
