[project]
name = "qte-ingestion"
version = "0.1.0"
description = "QTE data ingestion: provider live feed -> resampler -> Redis state + NATS events."
requires-python = ">=3.13,<3.14"
dependencies = [
    # The extras name the market data providers this image ships with; swapping
    # providers is one word here plus QTE_MARKET_DATA__PROVIDER. `simulator` is
    # the dev fixture — it adds no dependency the vendor extra did not already
    # bring, and without it a dev stack could not point ingestion at
    # `qte-simulator` without rebuilding the image.
    "qte-shared[tiingo,simulator]",
]

[project.optional-dependencies]
# The boot-time warm-up parks what it fetched in data/parquet/<provider>/ so a
# dev restart replays it instead of spending another request against a rate
# limited plan. That is a *dev* affordance and pyarrow is 152 MB, so it stays an
# extra: QTE_ENV=prod bypasses the cache by policy anyway, and a production
# image without this installed simply always asks the vendor. See
# `qte_shared.history_cache`, which degrades to "no cache" when pyarrow is absent.
history-cache = [
    "pyarrow>=16.0",
]

[project.scripts]
qte-ingestion = "qte_ingestion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_ingestion"]
