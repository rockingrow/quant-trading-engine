[project]
name = "qte-backtest"
version = "0.1.0"
description = "QTE backtest engine: Tiingo history downloader, parquet replay, fill simulation, reporting."
requires-python = ">=3.11"
dependencies = [
    "qte-shared",
    "httpx>=0.27",
    "pyarrow>=16.0",
]

[project.scripts]
qte-backtest = "qte_backtest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qte_backtest"]
