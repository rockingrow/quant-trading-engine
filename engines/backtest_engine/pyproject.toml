[project]
name = "qte-backtest"
version = "0.1.0"
description = "QTE backtest engine: provider history downloader, parquet replay, fill simulation, reporting."
requires-python = ">=3.13,<3.14"
dependencies = [
    # See data_ingestion: the extra pulls in the configured vendor's client.
    "qte-shared[tiingo]",
    "pyarrow>=16.0",
]

[project.scripts]
qte-backtest = "qte_backtest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_backtest"]
