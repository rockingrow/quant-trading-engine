[project]
name = "qte-simulator"
version = "0.1.0"
description = "QTE dev-only market data simulator: a WebSocket feed and the CLI that drives it."
requires-python = ">=3.13,<3.14"
dependencies = [
    # The `simulator` extra is the WebSocket stack — this engine is the server
    # for the provider that extra installs. No pyarrow: parquet replay works
    # from the workspace venv (where the backtest engine put it) and says so
    # when it cannot.
    "qte-shared[simulator]",
]

[project.scripts]
qte-simulator = "qte_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_simulator"]
