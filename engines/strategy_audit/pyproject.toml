[project]
name = "qte-strategy-audit"
version = "0.1.0"
description = "QTE strategy audit: validate the plugins in __strategies__/ against the QTE signal contract and the routing table."
requires-python = ">=3.13,<3.14"
dependencies = [
    "qte-shared",
]

[project.scripts]
qte-strategy-audit = "qte_strategy_audit.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qte_strategy_audit"]
